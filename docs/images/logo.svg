<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Rounded Squircle Base -->
  <rect x="8" y="8" width="104" height="104" rx="28" fill="#0d131f" stroke="#212c42" stroke-width="2" />
  
  <!-- Intersecting Model Manifolds / Tensor Orbit -->
  <path d="M 30 60 C 30 40, 50 32, 60 48 C 70 64, 90 60, 90 40" fill="none" stroke="url(#grad1)" stroke-width="5" stroke-linecap="round" />
  <path d="M 30 80 C 30 60, 50 56, 60 72 C 70 88, 90 80, 90 60" fill="none" stroke="url(#grad2)" stroke-width="5" stroke-linecap="round" />
  
  <!-- Spherical Linear Core Nodes -->
  <circle cx="30" cy="60" r="4.5" fill="#06b6d4" filter="url(#glow)" />
  <circle cx="60" cy="48" r="5" fill="#f8fafc" />
  <circle cx="90" cy="40" r="4.5" fill="#3b82f6" filter="url(#glow)" />
  
  <circle cx="30" cy="80" r="4.5" fill="#8b5cf6" filter="url(#glow)" />
  <circle cx="60" cy="72" r="5" fill="#f8fafc" />
  <circle cx="90" cy="60" r="4.5" fill="#ec4899" filter="url(#glow)" />
</svg>
